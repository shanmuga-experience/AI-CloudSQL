# Public front door for the dashboard. install.sh replaces __SERVER_NAME__ and __APP_PORT__.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_NAME__;

    auth_basic           "DB Health Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-dbdash;

    # Unauthenticated liveness check for uptime monitors
    location = /healthz { auth_basic off; access_log off; default_type text/plain; return 200 "ok\n"; }

    # Never serve dotfiles (.env, .git, ...)
    location ~ /\. { deny all; }

    location / {
        proxy_pass         http://127.0.0.1:__APP_PORT__;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "no-store" always;
    }
}
