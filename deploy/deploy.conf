# Settings for deploy/install.sh. Edit these 5 values before running it.
# (Database credentials go in ../.env, not here.)

# Cloud SQL connection name: PROJECT:REGION:INSTANCE
# Find it with: gcloud sql instances describe INSTANCE --format="value(connectionName)"
CLOUDSQL_CONNECTION_NAME="your-gcp-project-id:asia-south1:your-cloudsql-instance-name"

# "true" if the instance has a private IP in the VM's VPC, "false" to use its public IP
USE_PRIVATE_IP="true"

# Cloud SQL Auth Proxy v2 release (https://github.com/GoogleCloudPlatform/cloud-sql-proxy/releases)
PROXY_VERSION="v2.14.3"

# Login for the dashboard page (install.sh asks for the password)
DASHBOARD_USER="admin"

# Optional HTTPS. Leave DOMAIN empty to serve http://<VM external IP>/
# DOMAIN must already point at the VM's external IP (an A record, or <ip-with-dashes>.sslip.io)
DOMAIN=""
LETSENCRYPT_EMAIL=""
